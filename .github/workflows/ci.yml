name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter-web-smoke:
    # Catches a missing `web/` skeleton, a flutter version that
    # dropped web support, and a Pages-deploy breakage before either
    # PR lands on main. PR-only; deploy workflow does its own build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-web
      - run: flutter pub get
      - name: Build web (development theme, --base-href mirror)
        # Match the deploy workflow's flags so this smoke test
        # actually exercises what production renders.
        run: |
          flutter build web --release \
            --base-href=/animal-shadow-match/ \
            --dart-define=CATALOG_THEME=development \
            --dart-define=ENABLE_DEVELOPMENT_ASSETS=true
      - name: Verify bundle has the expected entry points
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/flutter.js
          test -f build/web/flutter_bootstrap.js
          test -f build/web/assets/AssetManifest.bin
          test -f build/web/assets/FontManifest.json

  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/validate_catalog.py
      - name: Python offline test suite
        run: |
          python -m unittest discover -s scripts/tests \
            -p 'test_minimax_batch.py' -v
          python -m unittest discover -s scripts/tests \
            -p 'test_minimax_chat_command.py' -v
          python -m unittest discover -s scripts/tests \
            -p 'test_prepare_assets.py' -v
          python -m unittest discover -s scripts/tests \
            -p 'test_promote_minimax_assets.py' -v
          python -m unittest discover -s scripts/tests \
            -p 'test_validate_catalog.py' -v
          python -m unittest discover -s scripts/tests \
            -p 'test_generate_v6_placeholders.py' -v
      - name: Generate v6 placeholders into a scratch directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev_placeholders"
          python scripts/generate_v6_placeholders.py \
            --output-dir "$RUNNER_TEMP/dev_placeholders" \
            --skip-index \
            --strict
          test -f "$RUNNER_TEMP/dev_placeholders/gel_star.webp"
          test -f "$RUNNER_TEMP/dev_placeholders/gel_star_shadow.webp"
      - name: Catalog strict-mode gate raises when items.json is empty
        run: |
          # Regression: --strict-min-items must refuse to ship an empty items.json.
          if python scripts/validate_catalog.py \
              --strict-min-items --min-items 4; then
            echo "strict gate allowed empty items.json" >&2
            exit 1
          fi
          # Confirm the gate fails because of the min-items rule:
          python scripts/validate_catalog.py \
            --strict-min-items --min-items 4 2>&1 \
            | grep -q "approved items"
      - name: Minimax dry-run CLI (offline, no key or API usage)
        env:
          MINIMAX_SUBSCRIPTION_ONLY: '1'
        run: |
          python scripts/minimax_batch.py --start 0 --count 2 \
            --region intl --output /tmp/minimax-ci-dryrun --dry-run
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('/tmp/minimax-ci-dryrun')
          report = json.loads((out / 'report.json').read_text())
          assert report['dry_run'] is True
          assert report['requested_count'] == 2
          assert all(x['status'] == 'planned' for x in report['items'])
          assert not list(out.glob('*.png'))
          assert not list(out.glob('*.jpg'))
          PY
