name: Pages deploy

# Deploys the development-theme Flutter web build to GitHub Pages.
#
# Why the switch from `gh-pages` push to `actions/deploy-pages`:
# GitHub Actions' built-in `GITHUB_TOKEN` does NOT trigger a Pages
# build when it pushes to the `gh-pages` branch. The push looks
# successful, but the public site stays on the last external push.
# The supported way to publish via Actions is:
#   1) build the static site locally
#   2) `actions/upload-pages-artifact` uploads it as a Pages artifact
#   3) `actions/deploy-pages` (with `pages: write` + `id-token: write`)
#      publishes it through the official Pages pipeline.
# This workflow follows that recipe.
#
# One-time owner prereq (this UI step *cannot* be expressed in YAML):
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
# Until that toggle is on, `actions/deploy-pages` will succeed but
# the public site will not update.
#
# Triggers:
# * `workflow_run` on the `CI` workflow completing successfully on
#   main. Tying this to a CI conclusion stops the deploy racing a
#   failing CI run.
# * `workflow_dispatch` for a manual republish.
#
# CI-gating:
# * The job `if:` only runs the workflow when the upstream CI
#   workflow reported `success`, or for an explicit dispatch.
# * Every step that pins the publish SHA also pins `actions/checkout`
#   to that exact commit, so the artifact is built from the commit
#   CI validated (not whatever is currently on main).
# * A "Re-check stale CI" step before deployment compares the
#   publish SHA against the live `origin/main` HEAD. If main moved
#   between the build job and the deploy job, the deploy is aborted
#   to avoid overwriting gh-pages with a stale build.
#
# Permissions:
# * `contents: read` for the checkout. We no longer push to gh-pages
#   ourselves.
# * `pages: write` + `id-token: write` are required for
#   `actions/deploy-pages`. They are deliberately NOT kept on any
#   other workflow.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

# Solve: the repo's Pages source must be "GitHub Actions" before any
# deploy in this workflow takes effect. The Pages settings page lives
# under Settings -> Pages -> Build and deployment -> Source. The
# rest of the publish path is automatic once that toggle is on.
#
# Steps below also gate on the upstream CI workflow reporting
# `success` (or on an explicit dispatch).

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BASE_HREF: /animal-shadow-match/
    # Run only when:
    #  - the upstream CI workflow reported `success`, OR
    #  - the trigger was a manual `workflow_dispatch`.
    # Anything else (CI still queued / failed / canceled) skips
    # the build entirely, so a broken main never reaches Pages.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch')
    # Surface the resolved publish SHA so the deploy job can re-verify
    # `origin/main` against the same value, even after a long build.
    outputs:
      publish_sha: ${{ steps.resolve_sha.outputs.publish_sha }}

    steps:
      - name: Resolve which commit to publish
        id: resolve_sha
        # workflow_run.head_sha is the commit the CI workflow checked
        # out and ran the test suite against. For a manual dispatch
        # there is no upstream CI run, so we publish whatever is
        # currently on main (GITHUB_SHA).
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "publish_sha=${{ github.event.workflow_run.head_sha }}" \
              >> "$GITHUB_OUTPUT"
          else
            echo "publish_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Reject stale CI at entry
        # Confirm the resolved publish SHA is still the tip of main
        # before we even start a build. If main moved on while the
        # CI workflow was still finishing, the green we are about
        # to publish is no longer the latest green, so we abort.
        # The repository is public, so `git ls-remote` works without
        # authentication; we deliberately do NOT use GITHUB_TOKEN here
        # because the publish step no longer needs it and `set -u`
        # would otherwise fail on the unset variable.
        run: |
          set -euo pipefail
          PUBLISH_SHA="${{ steps.resolve_sha.outputs.publish_sha }}"
          MAIN_TIP="$(
            git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              refs/heads/main | awk '{print $1}'
          )"
          if [ -z "$MAIN_TIP" ]; then
            echo "::error::could not resolve main tip"
            exit 1
          fi
          if [ "$MAIN_TIP" != "$PUBLISH_SHA" ]; then
            echo "::error::main moved on while CI was running"
            echo "::error::expected $PUBLISH_SHA, got $MAIN_TIP"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve_sha.outputs.publish_sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web (development theme)
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release \
            --base-href="${BASE_HREF}" \
            --dart-define=CATALOG_THEME=development \
            --dart-define=ENABLE_DEVELOPMENT_ASSETS=true

      - name: Sanity-check the bundle
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/flutter.js
          test -f build/web/flutter_bootstrap.js
          test -f build/web/assets/AssetManifest.bin
          test -f build/web/assets/FontManifest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Re-check stale CI at deploy time
        # Build can take long enough that main advances again.
        # Repeat the same tip check here so a build that *was* green
        # for its CI but no longer matches the latest main is not
        # promoted to Pages. Same unauthenticated `git ls-remote` as
        # the entry-time guard, for the same reason.
        env:
          PUBLISH_SHA: ${{ needs.build.outputs.publish_sha }}
        run: |
          set -euo pipefail
          MAIN_TIP="$(
            git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              refs/heads/main | awk '{print $1}'
          )"
          if [ -z "$MAIN_TIP" ] || [ "$MAIN_TIP" != "$PUBLISH_SHA" ]; then
            echo "::error::main moved on while Pages build was running"
            echo "::error::expected $PUBLISH_SHA, got $MAIN_TIP"
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
