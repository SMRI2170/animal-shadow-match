name: Promote MiniMax artifacts to the item pool (Draft PR)

# This workflow is the human-gated bridge between the MiniMax image-generation
# workflow and the Flutter item pool. It is *only* triggered on manual
# `workflow_dispatch`. It must:
#
# * never read a MiniMax API key — that lives in the generation workflow only;
# * only run inside this repository (no fork access);
# * only download artifacts from the production generation workflow;
# * create a Draft Pull Request so reviewers — not automation — decide
#   when an item ships. Auto-merging is intentionally absent.
#
# Decisions documented in docs/GENERATED_ASSETS_TO_GAME_POOL_JA.md §"完成形"
# and docs/MINIMAX_GITHUB_ACTIONS_JA.md.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run id of the successful minimax-images.yml workflow (numeric).'
        required: true
        type: string
      source_workflow:
        description: 'Filename of the generation workflow.'
        required: true
        default: 'minimax-images.yml'
        type: string
      approved_ids:
        description: >-
          Comma-separated candidate ids (e.g. "gel_star,cloud_cushion") that
          are approved for promotion. Unknown ids are rejected.
        required: true
        type: string
      background_mode:
        description: 'How to handle opaque images.'
        required: true
        default: 'auto_draft'
        type: choice
        options:
          - auto_draft
          - already_transparent

# Only permissions explicitly listed here are granted. The job needs:
# * contents:write     — create the branch and PR contents.
# * pull-requests:write — open the Draft PR.
# * actions:read        — read the source workflow run.
# We deliberately do NOT grant `id-token`, `packages`, or `security-events`.
permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: promote-minimax-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    name: Stage, validate and open Draft PR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # We must operate on a branch, not a detached checkout, so the PR
          # branch push below succeeds.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install offline asset tools
        run: python -m pip install -r scripts/requirements.txt

      # ------------------------------------------------------------
      # Stage 1: pull the approved artifact into a scratch directory
      # ------------------------------------------------------------

      - name: Confirm the requested run is on this repository
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          WORKFLOW: ${{ inputs.source_workflow }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI is required to read protected artifacts" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          meta="$(gh api "/repos/${owner}/${name}/actions/runs/${RUN_ID}" --jq '{status,conclusion,name}')"
          echo "Run metadata: ${meta}"
          status="$(echo "${meta}" | python -c 'import sys,json;print(json.load(sys.stdin)["status"])')"
          conclusion="$(echo "${meta}" | python -c 'import sys,json;print(json.load(sys.stdin)["conclusion"])')"
          wf="$(echo "${meta}" | python -c 'import sys,json;print(json.load(sys.stdin)["name"])')"
          if [[ "${status}" != "completed" || "${conclusion}" != "success" ]]; then
            echo "Run ${RUN_ID} did not finish successfully; refusing to promote" >&2
            exit 1
          fi
          if [[ "${wf}" != "${WORKFLOW}" ]]; then
            echo "Run ${RUN_ID} belongs to '${wf}', expected '${WORKFLOW}'" >&2
            exit 1
          fi

      - name: Download the artifact into a scratch directory
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          mkdir -p "$RUNNER_TEMP/minimax-artifact"
          gh run download "${RUN_ID}" --repo "${owner}/${name}" \
            --name "minimax-review-${RUN_ID}" \
            --dir "$RUNNER_TEMP/minimax-artifact"
          # The artifact must contain a report.json generated by
          # scripts/minimax_batch.py.
          test -f "$RUNNER_TEMP/minimax-artifact/report.json" || { echo "report.json missing from artifact" >&2; exit 1; }

      # ------------------------------------------------------------
      # Stage 2: filter the artifact down to the approved ids
      # ------------------------------------------------------------

      - name: Stage only the approved ids
        env:
          APPROVED: ${{ inputs.approved_ids }}
          ARTIFACT_DIR: ${{ runner.temp }}/minimax-artifact
          STAGING_DIR: ${{ runner.temp }}/staging
        run: |
          set -euo pipefail
          rm -rf "$STAGING_DIR" && mkdir -p "$STAGING_DIR"
          python - <<'PY'
          import json, os, re, shutil, sys
          from pathlib import Path
          approved = [t.strip() for t in os.environ["APPROVED"].split(",") if t.strip()]
          valid = re.compile(r"^[a-z0-9_]+$")
          for item in approved:
              if not valid.fullmatch(item):
                  print(f"rejecting unsafe id {item!r}", file=sys.stderr)
                  sys.exit(1)
          report = json.loads(Path(os.environ["ARTIFACT_DIR"], "report.json").read_text())
          items = {item["id"]: item for item in report.get("items", [])}
          unknown = [item for item in approved if item not in items]
          if unknown:
              print(f"unknown approved ids: {unknown}", file=sys.stderr)
              sys.exit(1)
          artifact_root = Path(os.environ["ARTIFACT_DIR"])
          staging = Path(os.environ["STAGING_DIR"])
          for item in approved:
              spec = items[item]
              if spec.get("status") != "generated_unreviewed":
                  print(f"{item}: status is {spec.get('status')!r}, refusing", file=sys.stderr)
                  sys.exit(1)
              filename = spec.get("file")
              if not filename:
                  print(f"{item}: missing file field", file=sys.stderr)
                  sys.exit(1)
              src = artifact_root / filename
              dst = staging / f"{item}{Path(filename).suffix}"
              shutil.copyfile(src, dst)
              print(f"staged {dst}")
          PY

      # ------------------------------------------------------------
      # Stage 3: build the WebP pair, update items.json
      # ------------------------------------------------------------

      - name: Process images into WebP color + shadow
        env:
          STAGING_DIR: ${{ runner.temp }}/staging
        run: |
          set -euo pipefail
          python scripts/prepare_assets.py \
            --input "$STAGING_DIR" \
            --output assets/items \
            --ids "${{ inputs.approved_ids }}" \
            --bg-mode "${{ inputs.background_mode }}" \
            --strict

      - name: Append entries to assets/catalog/items.json
        env:
          STAGING_DIR: ${{ runner.temp }}/staging
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          python scripts/promote_minimax_assets.py \
            --staging-dir "$STAGING_DIR" \
            --source-run-id "$RUN_ID" \
            --artifact-name "minimax-review-$RUN_ID" \
            --report-path "${{ runner.temp }}/promotion.json"

      - name: Validate the updated catalog (alpha masks + ids)
        run: python scripts/validate_catalog.py

      - name: Generate alpha+shadow preview contact sheet (PIL only)
        env:
          PROMOTION_REPORT: ${{ runner.temp }}/promotion.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw

          report = json.loads(Path(os.environ["PROMOTION_REPORT"]).read_text())
          accepted = report.get("accepted", [])
          if not accepted:
              print("no accepted items, skipping contact sheet")
              raise SystemExit(0)
          cell = 256
          margin = 16
          width = cell * len(accepted) + margin * (len(accepted) + 1)
          height = cell + margin * 2
          sheet = Image.new("RGB", (width, height), (255, 255, 255))
          draw = ImageDraw.Draw(sheet)
          for index, entry in enumerate(accepted):
              item_id = entry["id"]
              color_path = Path("assets/items", f"{item_id}.webp")
              shadow_path = Path("assets/items", f"{item_id}_shadow.webp")
              if not color_path.is_file() or not shadow_path.is_file():
                  print(f"missing webp pair for {item_id}", file=sys.stderr)
                  raise SystemExit(1)
              color = Image.open(color_path).convert("RGBA").resize((cell - margin, cell - margin))
              bg = Image.new("RGB", (cell, cell), (255, 255, 255))
              x = (cell - color.width) // 2
              y = (cell - color.height) // 2
              bg.paste(color, (x, y), color)
              sheet.paste(bg, (margin + index * (cell + margin), margin))
              draw.text((margin + index * (cell + margin) + 8, margin + 4), item_id, fill=(40, 40, 40))
          sheet.save("assets/items/_preview.png", "PNG")
          print("wrote preview sheet")
          PY

      # ------------------------------------------------------------
      # Stage 4: open a Draft PR
      # ------------------------------------------------------------

      - name: Push the promotion branch
        env:
          APPROVED: ${{ inputs.approved_ids }}
          RUN_ID: ${{ inputs.source_run_id }}
          BG_MODE: ${{ inputs.background_mode }}
        run: |
          set -euo pipefail
          branch="promote/minimax-${RUN_ID}-${GITHUB_RUN_ID}"
          echo "BRANCH=${branch}" >> "$GITHUB_ENV"
          git checkout -b "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Do not commit transient preview images; only the WebP pair +
          # updated catalog should land in the PR.
          git add assets/items assets/catalog/items.json
          git restore --staged assets/items/_preview.png || true
          if git diff --cached --quiet; then
              echo "no changes to commit; aborting Draft PR creation"
              exit 0
          fi
          git commit -m "feat(items): promote MiniMax run ${RUN_ID} reviewed ids

          Approved ids: ${APPROVED}
          Background mode: ${BG_MODE}
          Source run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}

          This PR is intentionally Draft and must be reviewed before merge."
          git push -u origin "${branch}"

      - name: Open Draft Pull Request (no auto-merge)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ env.BRANCH }}
          APPROVED: ${{ inputs.approved_ids }}
          RUN_ID: ${{ inputs.source_run_id }}
          BG_MODE: ${{ inputs.background_mode }}
        run: |
          set -euo pipefail
          if [ -z "${BRANCH:-}" ]; then
              echo "no branch to promote; nothing to do"
              exit 0
          fi
          owner="${GITHUB_REPOSITORY%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          body="$(cat <<EOF
          ## Promote MiniMax artifacts → Flutter item pool

          - **Source run:** https://github.com/${owner}/${name}/actions/runs/${RUN_ID}
          - **Approved ids:** \`${APPROVED}\`
          - **Background mode:** \`${BG_MODE}\`

          ### Checklist for a human reviewer
          - [ ] Each approved object is the intended single, complete object.
          - [ ] Transparent edges are clean (no white fringe, no missing limbs).
          - [ ] The contact sheet previews are visually distinguishable.
          - [ ] No trademarked character or scary imagery is present.
          - [ ] Each \`effectPreset\` matches the object's tactile intuition.

          Auto-merge is disabled by design. CI must remain green and a
          reviewer must press *Squash and merge* once they sign off above.
          EOF
          )"
          gh pr create \
            --repo "${owner}/${name}" \
            --head "${BRANCH}" \
            --base main \
            --draft \
            --title "feat(items): MiniMax run ${RUN_ID} reviewed ids" \
            --body "${body}"

      - name: Confirm Draft PR is open and unfinalized
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          branch="${BRANCH:-}"
          if [ -z "${branch}" ]; then
              exit 0
          fi
          state="$(gh pr list --repo "${owner}/${name}" --head "${branch}" \
            --json isDraft,state --jq '.[0] | "\(.state)|\(.isDraft)"')"
          echo "PR state: ${state}"
          if [[ "${state}" != "OPEN|true" ]]; then
              echo "Expected an OPEN Draft PR; got '${state}'" >&2
              exit 1
          fi

      - name: Upload preview contact sheet for the PR comment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promote-preview-${{ github.run_id }}
          path: |
            assets/items/_preview.png
            ${{ runner.temp }}/promotion.json
          if-no-files-found: warn
          retention-days: 7
