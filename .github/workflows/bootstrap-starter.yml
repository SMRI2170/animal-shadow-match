name: Bootstrap starter project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-starter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract checked-in starter ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f animal-shadow-match-starter.zip
          mkdir -p "$RUNNER_TEMP/starter"
          unzip -q animal-shadow-match-starter.zip -d "$RUNNER_TEMP/starter"
          test -f "$RUNNER_TEMP/starter/animal-shadow-match/lib/main.dart"
          cp -a "$RUNNER_TEMP/starter/animal-shadow-match/." .
          test -f lib/main.dart
          test -f docs/DESIGN_JA.md
          test -f assets/catalog/animals.json
      - name: Validate asset catalog
        shell: bash
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/validate_catalog.py
      - name: Commit unpacked sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: unpack Flutter starter and assets"
            git push origin HEAD:main
          fi
