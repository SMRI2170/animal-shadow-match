name: Squishy MVP - Android debug APK

# Produces an installable debug APK without a Play signing key.
# Never calls the MiniMax API or stores an image-generation secret.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/mvp-android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test and package demo APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget and domain tests
        run: flutter test
      - name: Create Android scaffold for this Flutter starter
        run: flutter create --platforms=android --project-name animal_shadow_match --no-pub .
      - name: Build the offline demo APK
        run: flutter build apk --debug
      - name: Upload APK for Android playtest
        uses: actions/upload-artifact@v7
        with:
          name: squishy-mvp-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
